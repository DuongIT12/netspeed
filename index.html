<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NetSpeed" />
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" href="" />
  <link id="favIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%230f172a'/%3E%3Cstop offset='100%25' stop-color='%23060913'/%3E%3C/linearGradient%3E%3ClinearGradient id='arc' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0%25' stop-color='%2300e5ff'/%3E%3Cstop offset='65%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' fill='url(%23bg)'/%3E%3Cpath d='M 36 126 A 62 62 0 1 1 144 126' fill='none' stroke='%231e293b' stroke-width='14' stroke-linecap='round'/%3E%3Cpath d='M 36 126 A 62 62 0 1 1 136 62' fill='none' stroke='url(%23arc)' stroke-width='14' stroke-linecap='round'/%3E%3Cpolygon points='90,98 134,54 96,104' fill='%2300e5ff'/%3E%3Ccircle cx='90' cy='102' r='11' fill='%23f8fafc'/%3E%3Ccircle cx='90' cy='102' r='5' fill='%230b0f19'/%3E%3C/svg%3E" />
  <title>NetSpeed Pro</title>

  <script>
    // Chuyển đổi SVG Data URI sang PNG 180x180 ngay lập tức để Safari iOS nhận diện apple-touch-icon
    (function generateAppleTouchIcon() {
      const svgMarkup = `
        <svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#131c31"/>
              <stop offset="100%" stop-color="#070a12"/>
            </linearGradient>
            <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#00e5ff"/>
              <stop offset="60%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
          <rect width="180" height="180" fill="url(#bg)"/>
          <circle cx="90" cy="100" r="64" fill="none" stroke="rgba(0,229,255,0.08)" stroke-width="2"/>
          <path d="M 38 128 A 60 60 0 1 1 142 128" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
          <path d="M 38 128 A 60 60 0 1 1 134 62" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
          <polygon points="86,96 134,54 94,104" fill="#00e5ff"/>
          <circle cx="90" cy="100" r="11" fill="#f8fafc"/>
          <circle cx="90" cy="100" r="5" fill="#0b0f19"/>
        </svg>
      `.trim();

      const svgDataUri = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgMarkup);
      const img = new Image();
      img.onload = function () {
        const c = document.createElement("canvas");
        c.width = 180;
        c.height = 180;
        const g = c.getContext("2d");
        g.drawImage(img, 0, 0, 180, 180);
        document.getElementById("appleTouchIcon").href = c.toDataURL("image/png");
      };
      img.src = svgDataUri;
    })();
  </script>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --card-border: rgba(255, 255, 255, 0.06);
      --accent: #00e5ff;
      --upload: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 18px env(safe-area-inset-bottom, 24px);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    header { text-align: center; padding-top: 8px; margin-bottom: 14px; }
    header h1 { font-size: 19px; font-weight: 800; letter-spacing: 0.6px; color: var(--accent); }

    .net-info-bar {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 16px;
      gap: 8px;
    }
    .net-left { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
    .isp-name { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ip-addr { color: var(--muted); font-variant-numeric: tabular-nums; }
    .node-badge {
      background: rgba(0, 229, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(0, 229, 255, 0.25);
      padding: 5px 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 11px;
      white-space: nowrap;
    }

    .gauge-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 8px 0 18px;
    }
    .speed-circle {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #182238 60%, #0b0f19 100%);
      border: 4px solid #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.12);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .speed-circle.testing-dl { border-color: var(--accent); box-shadow: 0 0 40px rgba(0, 229, 255, 0.3); }
    .speed-circle.testing-ul { border-color: var(--upload); box-shadow: 0 0 40px rgba(168, 85, 247, 0.3); }

    #speedChart {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 52%;
      pointer-events: none;
      z-index: 1;
    }

    .gauge-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-10px);
    }

    .speed-value { font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; text-shadow: 0 2px 10px rgba(11, 15, 25, 0.8); }
    .speed-unit { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .phase-label { font-size: 11px; color: var(--accent); margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
    .testing-ul .phase-label { color: var(--upload); }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric-card {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--card-border);
    }
    .metric-title { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.4px; }
    .metric-val { font-size: 21px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .metric-val span { font-size: 12px; font-weight: 500; color: var(--muted); }

    .btn-start {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00e5ff, #0284c7);
      color: #04101d;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      margin-bottom: 22px;
    }
    .btn-start:active { transform: scale(0.98); }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }

    .history-section { margin-top: auto; }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .history-header h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    .btn-clear {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .hist-meta { display: flex; flex-direction: column; gap: 3px; }
    .hist-time { color: var(--muted); font-size: 11px; }
    .hist-isp { color: var(--text); font-weight: 600; font-size: 12px; }
    .hist-speeds { display: flex; gap: 12px; text-align: right; font-variant-numeric: tabular-nums; }
    .hist-col span { display: block; font-size: 10px; color: var(--muted); }
    .hist-col strong { font-size: 14px; }
    .dl-color { color: var(--accent); }
    .ul-color { color: var(--upload); }
    .empty-history { text-align: center; color: var(--muted); font-size: 12px; padding: 14px; background: var(--card); border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>NETSPEED CLOUD</h1>
  </header>

  <div class="net-info-bar">
    <div class="net-left">
      <div class="isp-name" id="ispName">Đang nhận diện nhà mạng...</div>
      <div class="ip-addr" id="ipAddr">IP: --.--.--.--</div>
    </div>
    <div class="node-badge" id="cfNode">Node: ...</div>
  </div>

  <div class="gauge-container">
    <div class="speed-circle" id="circle">
      <canvas id="speedChart"></canvas>
      <div class="gauge-content">
        <div class="speed-value" id="liveSpeed">0.0</div>
        <div class="speed-unit">Mbps</div>
        <div class="phase-label" id="phaseText">Sẵn sàng</div>
      </div>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-title">PING</div>
      <div class="metric-val" id="pingVal">-- <span>ms</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">JITTER</div>
      <div class="metric-val" id="jitterVal">-- <span>ms</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">DOWNLOAD</div>
      <div class="metric-val" id="dlVal">-- <span>Mbps</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">UPLOAD</div>
      <div class="metric-val" id="ulVal">-- <span>Mbps</span></div>
    </div>
  </div>

  <button class="btn-start" id="startBtn" onclick="runSpeedtest()">BẮT ĐẦU ĐO</button>

  <div class="history-section">
    <div class="history-header">
      <h2>Lịch sử đo (Tối đa 10 lần)</h2>
      <button class="btn-clear" id="clearBtn" onclick="clearHistory()">Xóa tất cả</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const CF_DOWN = "https://speed.cloudflare.com/__down";
    const CF_UP = "https://speed.cloudflare.com/__up";
    const CF_TRACE = "https://speed.cloudflare.com/cdn-cgi/trace";
    const STORAGE_KEY = "netspeed_history_v1";

    const IATA_MAP = {
      HAN: "Hà Nội (HAN)",
      SGN: "TP.HCM (SGN)",
      DAD: "Đà Nẵng (DAD)",
      HKG: "Hồng Kông (HKG)",
      SIN: "Singapore (SIN)",
      NRT: "Tokyo (NRT)",
      TPE: "Đài Bắc (TPE)"
    };

    let currentNet = { ip: "Unknown", isp: "Không rõ nhà mạng", node: "CF Edge" };
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    const canvas = document.getElementById("speedChart");
    const ctx = canvas.getContext("2d");
    let chartSamples = [];
    let chartColor = "#00e5ff";

    function initCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function resetChart(color = "#00e5ff") {
      chartSamples = [];
      chartColor = color;
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
    }

    function pushChartPoint(mbps) {
      chartSamples.push(mbps);
      if (chartSamples.length > 55) chartSamples.shift();
      drawChart();
    }

    function drawChart() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      if (chartSamples.length < 2) return;

      const maxVal = Math.max(...chartSamples, 10) * 1.15;
      const stepX = w / Math.max(chartSamples.length - 1, 1);

      const points = chartSamples.map((val, idx) => ({
        x: idx * stepX,
        y: h - (val / maxVal) * (h - 10) - 4
      }));

      ctx.beginPath();
      ctx.moveTo(points[0].x, h);
      ctx.lineTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const xc = (points[i - 1].x + points[i].x) / 2;
        const yc = (points[i - 1].y + points[i].y) / 2;
        ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
      }
      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.lineTo(last.x, h);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      if (chartColor === "#a855f7") {
        grad.addColorStop(0, "rgba(168, 85, 247, 0.38)");
        grad.addColorStop(1, "rgba(168, 85, 247, 0.0)");
      } else {
        grad.addColorStop(0, "rgba(0, 229, 255, 0.38)");
        grad.addColorStop(1, "rgba(0, 229, 255, 0.0)");
      }
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const xc = (points[i - 1].x + points[i].x) / 2;
        const yc = (points[i - 1].y + points[i].y) / 2;
        ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, xc, yc);
      }
      ctx.lineTo(last.x, last.y);
      ctx.strokeStyle = chartColor;
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    window.addEventListener("resize", () => {
      initCanvas();
      drawChart();
    });

    async function fetchNetworkInfo() {
      try {
        const traceRes = await fetch(`${CF_TRACE}?r=${Date.now()}`, { cache: "no-store" });
        const traceText = await traceRes.text();
        const lines = Object.fromEntries(
          traceText.trim().split("\n").map((line) => line.split("="))
        );
        if (lines.ip) currentNet.ip = lines.ip;
        if (lines.colo) {
          currentNet.node = IATA_MAP[lines.colo] || `Node: ${lines.colo}`;
          document.getElementById("cfNode").innerText = currentNet.node;
        }
        document.getElementById("ipAddr").innerText = `IP: ${currentNet.ip}`;
      } catch (e) {}

      try {
        const geoRes = await fetch("https://ipwho.is/", { cache: "no-store" });
        const geo = await geoRes.json();
        if (geo && geo.success) {
          currentNet.ip = geo.ip || currentNet.ip;
          currentNet.isp = (geo.connection && geo.connection.isp) ? geo.connection.isp : (geo.org || "Nhà mạng Internet");
          document.getElementById("ispName").innerText = currentNet.isp;
          document.getElementById("ipAddr").innerText = `IP: ${currentNet.ip}`;
        }
      } catch (e) {
        document.getElementById("ispName").innerText = "Mạng Internet";
      }
    }

    async function measurePing() {
      resetChart("#00e5ff");
      document.getElementById("phaseText").innerText = "Đang đo Ping...";
      const times = [];

      await fetch(`${CF_DOWN}?bytes=0&r=${Date.now()}`, { cache: "no-store" });

      for (let i = 0; i < 12; i++) {
        const start = performance.now();
        await fetch(`${CF_DOWN}?bytes=0&r=${Date.now()}_${i}`, { cache: "no-store" });
        times.push(performance.now() - start);
        await sleep(35);
      }

      const minPing = Math.min(...times);
      let jitterSum = 0;
      for (let i = 1; i < times.length; i++) {
        jitterSum += Math.abs(times[i] - times[i - 1]);
      }
      const jitter = jitterSum / (times.length - 1);

      document.getElementById("pingVal").innerHTML = `${minPing.toFixed(1)} <span>ms</span>`;
      document.getElementById("jitterVal").innerHTML = `${jitter.toFixed(1)} <span>ms</span>`;
      return { ping: minPing.toFixed(1), jitter: jitter.toFixed(1) };
    }

    async function measureDownload() {
      const circle = document.getElementById("circle");
      circle.className = "speed-circle testing-dl";
      document.getElementById("phaseText").innerText = "Đang tải xuống...";
      resetChart("#00e5ff");

      const CONCURRENCY = 4;
      const DURATION_MS = 8000;
      const CHUNK_BYTES = 25 * 1000 * 1000;
      let totalBytes = 0;
      let lastSampleBytes = 0;
      let lastSampleTime = performance.now();
      let running = true;
      const startTime = performance.now();

      const worker = async (id) => {
        while (running) {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), DURATION_MS);
          try {
            const res = await fetch(`${CF_DOWN}?bytes=${CHUNK_BYTES}&r=${Date.now()}_${id}`, {
              cache: "no-store",
              signal: controller.signal,
            });
            const reader = res.body.getReader();
            while (running) {
              const { done, value } = await reader.read();
              if (done) break;
              totalBytes += value.byteLength;
              if (performance.now() - startTime >= DURATION_MS) {
                running = false;
                controller.abort();
                break;
              }
            }
          } catch (e) {} finally {
            clearTimeout(timeout);
          }
        }
      };

      const uiInterval = setInterval(() => {
        const now = performance.now();
        const elapsedSec = (now - startTime) / 1000;
        const deltaSec = (now - lastSampleTime) / 1000;

        if (elapsedSec > 0.15 && deltaSec > 0) {
          const avgMbps = (totalBytes * 8) / (elapsedSec * 1_000_000);
          const instantMbps = ((totalBytes - lastSampleBytes) * 8) / (deltaSec * 1_000_000);
          document.getElementById("liveSpeed").innerText = avgMbps.toFixed(1);
          pushChartPoint(instantMbps);
          lastSampleBytes = totalBytes;
          lastSampleTime = now;
        }
      }, 150);

      await Promise.all(Array.from({ length: CONCURRENCY }, (_, i) => worker(i)));
      clearInterval(uiInterval);

      const totalSec = (performance.now() - startTime) / 1000;
      const finalMbps = ((totalBytes * 8) / (totalSec * 1_000_000)).toFixed(1);
      document.getElementById("liveSpeed").innerText = finalMbps;
      document.getElementById("dlVal").innerHTML = `${finalMbps} <span>Mbps</span>`;
      return finalMbps;
    }

    async function measureUpload() {
      const circle = document.getElementById("circle");
      circle.className = "speed-circle testing-ul";
      document.getElementById("phaseText").innerText = "Đang tải lên...";
      resetChart("#a855f7");

      const CONCURRENCY = 3;
      const DURATION_MS = 8000;
      const payload = new Uint8Array(2 * 1024 * 1024);
      let totalBytes = 0;
      let lastSampleBytes = 0;
      let lastSampleTime = performance.now();
      let running = true;
      const startTime = performance.now();

      const worker = async (id) => {
        while (running) {
          if (performance.now() - startTime >= DURATION_MS) {
            running = false;
            break;
          }
          try {
            await fetch(`${CF_UP}?r=${Date.now()}_${id}`, {
              method: "POST",
              body: payload,
              cache: "no-store",
            });
            totalBytes += payload.byteLength;
          } catch (e) {
            break;
          }
        }
      };

      const uiInterval = setInterval(() => {
        const now = performance.now();
        const elapsedSec = (now - startTime) / 1000;
        const deltaSec = (now - lastSampleTime) / 1000;

        if (elapsedSec > 0.15 && deltaSec > 0) {
          const avgMbps = (totalBytes * 8) / (elapsedSec * 1_000_000);
          const instantMbps = ((totalBytes - lastSampleBytes) * 8) / (deltaSec * 1_000_000);
          document.getElementById("liveSpeed").innerText = avgMbps.toFixed(1);
          pushChartPoint(instantMbps > 0 ? instantMbps : avgMbps);
          lastSampleBytes = totalBytes;
          lastSampleTime = now;
        }
      }, 150);

      await Promise.all(Array.from({ length: CONCURRENCY }, (_, i) => worker(i)));
      clearInterval(uiInterval);

      const totalSec = (performance.now() - startTime) / 1000;
      const finalMbps = ((totalBytes * 8) / (totalSec * 1_000_000)).toFixed(1);
      document.getElementById("liveSpeed").innerText = finalMbps;
      document.getElementById("ulVal").innerHTML = `${finalMbps} <span>Mbps</span>`;
      return finalMbps;
    }

    function saveHistory(record) {
      let list = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      list.unshift(record);
      if (list.length > 10) list = list.slice(0, 10);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById("historyList");
      const clearBtn = document.getElementById("clearBtn");
      const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

      if (list.length === 0) {
        clearBtn.style.display = "none";
        container.innerHTML = `<div class="empty-history">Chưa có dữ liệu đo nào được lưu</div>`;
        return;
      }

      clearBtn.style.display = "block";
      container.innerHTML = list.map((item) => `
        <div class="history-item">
          <div class="hist-meta">
            <div class="hist-isp">${item.isp} • ${item.node}</div>
            <div class="hist-time">${item.time} • Ping ${item.ping}ms</div>
          </div>
          <div class="hist-speeds">
            <div class="hist-col">
              <span>DOWN</span>
              <strong class="dl-color">${item.dl}</strong>
            </div>
            <div class="hist-col">
              <span>UP</span>
              <strong class="ul-color">${item.ul}</strong>
            </div>
          </div>
        </div>
      `).join("");
    }

    async function runSpeedtest() {
      const btn = document.getElementById("startBtn");
      const circle = document.getElementById("circle");
      btn.disabled = true;

      document.getElementById("pingVal").innerHTML = `-- <span>ms</span>`;
      document.getElementById("jitterVal").innerHTML = `-- <span>ms</span>`;
      document.getElementById("dlVal").innerHTML = `-- <span>Mbps</span>`;
      document.getElementById("ulVal").innerHTML = `-- <span>Mbps</span>`;

      await fetchNetworkInfo();

      try {
        const { ping, jitter } = await measurePing();
        const dl = await measureDownload();
        const ul = await measureUpload();

        document.getElementById("phaseText").innerText = "Hoàn tất";

        const now = new Date();
        const timeStr = now.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) +
                        " " + now.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" });

        saveHistory({
          time: timeStr,
          isp: currentNet.isp,
          node: currentNet.node,
          ping,
          jitter,
          dl,
          ul
        });
      } catch (err) {
        document.getElementById("phaseText").innerText = "Lỗi kết nối";
      } finally {
        circle.className = "speed-circle";
        btn.disabled = false;
        btn.innerText = "ĐO LẠI";
      }
    }

    initCanvas();
    fetchNetworkInfo();
    renderHistory();
  </script>
</body>
</html>
